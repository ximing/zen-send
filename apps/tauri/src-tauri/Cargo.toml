[package]
name = "zen-send-desktop"
version = "1.0.11"
description = "Zen Send desktop shell"
authors = ["Zen Send"]
edition = "2021"
license = "MIT"
rust-version = "1.77.2"

[lib]
name = "zen_send_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools", "image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
